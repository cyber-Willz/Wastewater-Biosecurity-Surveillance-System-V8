[package]
name        = "ww_api"
version     = "0.1.0"
edition     = "2021"
description = "Axum REST service + PostgreSQL persistence for the ww_biosec surveillance pipeline."

[lib]
name = "ww_api"
path = "src/lib.rs"

[[bin]]
name = "ww_api"
path = "src/main.rs"

[[bin]]
name = "scotland_live"
path = "src/bin/scotland_live.rs"

[dependencies]
ww_domain    = { path = "../ww_domain" }
ww_detection = { path = "../ww_detection" }

axum              = "0.7"
tokio             = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-postgres    = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = "0.14"

serde      = { workspace = true }
# float_roundtrip: JSON -> f64 must be bit-exact, or replayed baselines could
# drift from the ones computed at ingest time.
serde_json = { workspace = true, features = ["float_roundtrip"] }
chrono     = { workspace = true }
thiserror  = { workspace = true }

tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Live-run client (bin/scotland_live), integration tests, and outbound webhook dispatcher.
# rustls-tls: needed when WW_N8N_BASE_URL is an https:// endpoint.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
csv     = "1"
